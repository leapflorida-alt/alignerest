<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>AlignerEst™ — SML Chairside Aligner Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1117;font-family:system-ui,sans-serif;overscroll-behavior:none;color:#e2e8f0}
input,select,button{font-family:inherit}
button{cursor:pointer;border:none;background:none}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--primary:#2ea043;--primary-dim:#1a5f2a;--accent:#58a6ff;--accent-dim:#1f3a6e;--warn:#d29922;--danger:#f85149;--muted:#8b949e}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.inp{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:#e2e8f0;background:var(--surface2);outline:none}
.inp:focus{border-color:var(--accent)}
.prim{background:var(--primary);color:#fff;border-radius:10px;padding:13px;font-size:15px;font-weight:700;width:100%;cursor:pointer;border:none;display:block;text-align:center;transition:opacity .15s}
.prim:disabled{opacity:.4}
.prim:hover:not(:disabled){opacity:.88}
.sec-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:block}
input[type=range]{accent-color:var(--accent);width:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:90px}
#header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 0;position:sticky;top:0;z-index:20}
#header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#logo{width:38px;height:38px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
#title-block h1{font-size:17px;font-weight:800;color:#e2e8f0}
#title-block p{font-size:9px;color:var(--muted);text-transform:uppercase}
#pat-badge{font-size:12px;color:var(--accent);font-weight:600;margin-left:auto}
#tabs{display:grid;grid-template-columns:repeat(5,1fr)}
.tab-btn{padding:8px 2px 10px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:10px;font-weight:500;cursor:pointer}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab-icon{font-size:15px;display:block;margin-bottom:2px}
#content{padding:14px 14px 0}
.canvas-wrap{position:relative;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--border);touch-action:none;user-select:none}
.canvas-wrap canvas{display:block;width:100%;height:auto}
.ai-status{border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600}
.ai-status.loading{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent)}
.ai-status.done{background:#1a3a23;border:1px solid var(--primary);color:var(--primary)}
.ai-status.err{background:#3b1e1e;border:1px solid var(--danger);color:var(--danger)}
.ai-spinner{width:16px;height:16px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.edit-panel{padding:12px;border-top:1px solid var(--border)}
.tooth-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tooth-chip{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.tooth-chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.tooth-chip.corrected{background:#1a3a23;color:var(--primary);border-color:var(--primary)}
.slider-row{margin-bottom:8px}
.slider-lbl{display:flex;justify-content:space-between;margin-bottom:3px;font-size:10px;color:var(--muted)}
.nudge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.nudge-btn{padding:8px 4px;border-radius:8px;background:var(--surface2);color:#c9d1d9;font-size:11px;font-weight:700;border:1px solid var(--border);cursor:pointer}
.stats-row{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-bottom:10px}
.sel-actions{display:flex;gap:6px;margin-bottom:10px}
.btn-correct{flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;border:none;background:var(--primary-dim);color:var(--primary)}
.btn-correct.done{background:#1a3a23;color:#56d364}
.btn-remove{padding:8px 12px;border-radius:8px;background:#3b1e1e;color:var(--danger);font-weight:700;font-size:12px;border:1px solid #5a2020;cursor:pointer}
.warn-box{border-radius:8px;padding:6px 10px;margin-bottom:8px;font-size:11px;font-weight:600}
.warn-attach{background:#2d2008;color:var(--warn);border:1px solid #5a4308}
.warn-flag{background:#3b1e1e;color:var(--danger);border:1px solid #5a2020}
.photo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.photo-slot{cursor:pointer}
.photo-slot-thumb{height:88px;border-radius:10px;overflow:hidden;border:2px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;position:relative}
.photo-slot-thumb.filled{border-color:var(--primary)}
.photo-slot-thumb img{width:100%;height:100%;object-fit:cover}
.photo-slot-check{position:absolute;top:4px;right:4px;background:var(--primary);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
.photo-slot-label{font-size:10px;font-weight:600;color:#c9d1d9;margin-top:4px}
.photo-slot-hint{font-size:9px;color:var(--muted)}
.quote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.quote-cell{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 6px}
.quote-cell-label{font-size:10px;color:var(--muted);margin-bottom:3px}
.quote-cell-val{font-size:22px;font-weight:700}
.quote-cell-sub{font-size:9px;margin-top:2px}
.tray-banner{background:#1a3a23;border:1px solid #2ea04366;border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.tray-rule-box{background:var(--accent-dim);border:1px solid #58a6ff44;border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:11px;color:var(--accent);line-height:1.6}
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ba-label{font-size:9px;font-weight:700;margin-bottom:3px;color:var(--muted)}
.ba-frame{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.ba-frame canvas{display:block;width:100%}
.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.share-btn{padding:12px 8px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--accent);line-height:1.5;cursor:pointer}
.share-btn-icon{font-size:20px;margin-bottom:3px;display:block}
.mode-strip{display:flex;border-bottom:1px solid var(--border);background:var(--surface)}
.mode-btn{flex:1;padding:9px;background:none;color:var(--muted);font-weight:500;font-size:11px;border:none;border-bottom:2px solid transparent;cursor:pointer}
.mode-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.arch-editor-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.arch-editor-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.arch-editor-title{font-weight:700;font-size:13px;color:#e2e8f0}
.arch-editor-status{font-size:10px;color:var(--muted);margin-top:2px}
.arch-header-badges{display:flex;gap:6px;align-items:center}
.badge-pill{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700}
.tools-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:6px 10px;display:flex;align-items:center;justify-content:space-between}
.tools-btn{font-size:10px;padding:4px 9px;border-radius:6px;background:transparent;color:var(--muted);font-weight:600;border:1px solid transparent;cursor:pointer}
.tools-panel{padding:10px;border-bottom:1px solid var(--border)}
.quick-actions{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px}
.btn-correct-all{flex:1;padding:8px;border-radius:8px;background:#1a3a23;color:var(--primary);font-size:11px;font-weight:700;border:1px solid #2ea04344;cursor:pointer}
.btn-reset-arch{padding:8px 14px;border-radius:8px;background:#3b1e1e;color:var(--danger);font-size:11px;font-weight:600;border:1px solid #5a2020;cursor:pointer}
@media print{body{background:#fff;color:#000}#header,#tabs,.tab-btn,.prim,.btn-correct-all,.btn-reset-arch,.share-grid,#new-case-btn{display:none!important}#app{padding:0}}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-top">
      <div id="logo">🦷</div>
      <div id="title-block"><h1>AlignerEst™</h1><p>AI Chairside Aligner Tool · SML</p></div>
      <div id="pat-badge"></div>
    </div>
    <div id="tabs">
      <button class="tab-btn active" onclick="setTab(0)"><span class="tab-icon">📷</span>Photos</button>
      <button class="tab-btn" onclick="setTab(1)"><span class="tab-icon">⬆️</span>Upper</button>
      <button class="tab-btn" onclick="setTab(2)"><span class="tab-icon">⬇️</span>Lower</button>
      <button class="tab-btn" onclick="setTab(3)"><span class="tab-icon">💰</span>Quote</button>
      <button class="tab-btn" onclick="setTab(4)"><span class="tab-icon">📋</span>Report</button>
    </div>
  </div>
  <div id="content"></div>
</div>
<script>
const PRICE_PER_TRAY=65,LAB_FEE=225,MARKUP=1.4,CANVAS_W=680,CANVAS_H=520;
const ROT_MAX=30,ROT_WARN=20,ROT_FLAG=25,ROT_ATTACH=18,DEG_PER_TRAY=5,MM_PER_TRAY=0.25;
const UPPER_TEETH=[{id:6,label:'#6',name:'UR Canine',widthMm:7.5,heightMm:9.6},{id:7,label:'#7',name:'UR Lateral',widthMm:6.5,heightMm:8.3},{id:8,label:'#8',name:'UR Central',widthMm:8.5,heightMm:10.9},{id:9,label:'#9',name:'UL Central',widthMm:8.5,heightMm:10.9},{id:10,label:'#10',name:'UL Lateral',widthMm:6.5,heightMm:8.3},{id:11,label:'#11',name:'UL Canine',widthMm:7.5,heightMm:9.6}];
const LOWER_TEETH=[{id:22,label:'#22',name:'LL Canine',widthMm:6.5,heightMm:8.3},{id:23,label:'#23',name:'LL Lateral',widthMm:6.0,heightMm:7.7},{id:24,label:'#24',name:'LL Central',widthMm:5.5,heightMm:7.1},{id:25,label:'#25',name:'LR Central',widthMm:5.5,heightMm:7.1},{id:26,label:'#26',name:'LR Lateral',widthMm:6.0,heightMm:7.7},{id:27,label:'#27',name:'LR Canine',widthMm:6.5,heightMm:8.3}];

let state={tab:0,patName:'',patDOB:'',photos:{upper:null,lower:null,facial:null},upper:mkA(),lower:mkA()};
function mkA(){return{placements:[],ppm:null,mode:'place',placeIdx:0,selId:null,showTools:false,brightness:100,contrast:100,saturation:100,zoom:1,panX:0,panY:0,aiStatus:null,samStatus:null,aiMsg:'',samMsg:'',_img:null,gumColor:null};}
const IS={upper:mkI(),lower:mkI()};
function mkI(){return{isPanning:false,lastTouch:null,pinchDist:null,calibStep:0,calibPt1:null,drag:null,rotHandle:null};}

function tTrays(p,ppm){if(!p.corrected||!p.placed)return 0;const s=ppm||6,dx=(p.origX-p.idealX)/s,dy=(p.origY-p.idealY)/s,t=Math.sqrt(dx*dx+dy*dy)/MM_PER_TRAY,r=Math.abs(p.rot||0)/DEG_PER_TRAY,tot=Math.max(t,r);if(tot===0)return 0;return tot<1?1:Math.ceil(tot);}
function aTrays(pl,ppm){return pl.length?Math.max(0,...pl.map(t=>tTrays(t,ppm))):0;}
function cx(t){if(t===0)return{label:'—',color:'#8b949e'};if(t<=4)return{label:'Simple',color:'#2ea043'};if(t<=10)return{label:'Moderate',color:'#d29922'};return{label:'Complex',color:'#f85149'};}
function rc(rot){const r=Math.abs(rot||0);if(r>=ROT_MAX)return'#f85149';if(r>=ROT_FLAG)return'#e05f40';if(r>=ROT_ATTACH)return'#d29922';if(r>=ROT_WARN)return'#ca8a04';return null;}
function labCost(t){return t*PRICE_PER_TRAY+LAB_FEE;}
function drCost(t){return Math.round(labCost(t)*MARKUP/5)*5;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── AI Detection via /api/detect ──────────────────────────────
async function runAI(arch){
  const photo=state.photos[arch];if(!photo)return;
  const as=state[arch];
  as.aiStatus='loading';as.aiMsg='Claude Vision locating teeth…';as.samStatus=null;as.samMsg='';
  render();
  try{
    const b64=photo.includes(',')?photo.split(',')[1]:photo;
    const mt=photo.startsWith('data:image/png')?'image/png':'image/jpeg';
    const resp=await fetch('/api/detect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:b64,imageType:mt,arch})});
    const parsed=await resp.json();
    if(!resp.ok)throw new Error(parsed.error||'Detection failed');
    const td=arch==='upper'?UPPER_TEETH:LOWER_TEETH;
    as.ppm=parsed.ppm?(parsed.ppm*CANVAS_W/1000):6;
    as.placements=[];
    for(const t of parsed.teeth){
      if(!t.visible)continue;
      const def=td.find(d=>d.id===t.id);if(!def)continue;
      const ppm=as.ppm||6,x=t.cx*CANVAS_W,y=t.cy*CANVAS_H;
      as.placements.push({id:def.id,label:def.label,name:def.name,widthMm:def.widthMm,heightMm:def.heightMm,
        x,y,origX:x,origY:y,idealX:x,idealY:y,
        wPx:def.widthMm*ppm,hPx:def.heightMm*ppm,rot:0,corrected:false,placed:true,polygon:null});
    }
    as.placeIdx=as.placements.length;as.mode='edit';
    as.aiStatus='done';as.aiMsg=`Found ${as.placements.length} teeth — segmenting…`;
    render();
    await runSAM(arch,photo);
  }catch(err){as.aiStatus='error';as.aiMsg='Detection failed: '+err.message;render();}
}

// ── SAM Segmentation via /api/segment ─────────────────────────
async function runSAM(arch,photo){
  const as=state[arch];if(!as.placements.length)return;
  as.samStatus='loading';as.samMsg=`Segmenting ${as.placements.length} teeth…`;render();
  const b64=photo.includes(',')?photo.split(',')[1]:photo;
  let ok=0;
  for(const p of as.placements){
    try{
      const resp=await fetch('/api/segment',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({imageBase64:b64,cx:p.origX/CANVAS_W,cy:p.origY/CANVAS_H,imageId:`${arch}_${p.id}`})});
      const data=await resp.json();
      if(data.polygon&&data.polygon.length>2){
        p.polygon=data.polygon.map(([fx,fy])=>[fx*CANVAS_W,fy*CANVAS_H]);ok++;
      }else{p.polygon=makeBbox(p);}
    }catch{p.polygon=makeBbox(p);}
    const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');
  }
  as.samStatus='done';as.samMsg=ok>0?`✓ ${ok} polygon cutouts active`:'Using bounding box clips';
  render();
}

function makeBbox(p){const w=p.wPx||20,h=p.hPx||28,cx=p.origX,cy=p.origY,l=cx-w/2,t=cy-h/2,ri=cx+w/2,b=cy+h/2,r=3;return[[l+r,t],[ri-r,t],[ri,t+r],[ri,b-r],[ri-r,b],[l+r,b],[l,b-r],[l,t+r]];}
function tpoly(poly,dx,dy){return poly?poly.map(([x,y])=>[x+dx,y+dy]):null;}
function rpoly(poly,cx,cy,deg){if(!poly)return null;const rad=deg*Math.PI/180,cos=Math.cos(rad),sin=Math.sin(rad);return poly.map(([x,y])=>{const dx=x-cx,dy=y-cy;return[cx+dx*cos-dy*sin,cy+dx*sin+dy*cos];});}
function polyPath(ctx,poly){if(!poly||poly.length<3)return false;ctx.beginPath();ctx.moveTo(poly[0][0],poly[0][1]);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i][0],poly[i][1]);ctx.closePath();return true;}

// ── Canvas ────────────────────────────────────────────────────
function getCV(arch){return document.getElementById('canvas-main-'+arch);}

function sampleGum(ctx,pl){
  let r=0,g=0,b=0,n=0;
  for(const[sx,sy] of[[20,20],[CANVAS_W-20,20],[CANVAS_W/2,CANVAS_H-20],[20,CANVAS_H-20]]){
    if(!pl.some(p=>Math.hypot(p.origX-sx,p.origY-sy)<30)){const d=ctx.getImageData(sx,sy,1,1).data;r+=d[0];g+=d[1];b+=d[2];n++;}
  }
  return n?{r:Math.round(r/n),g:Math.round(g/n),b:Math.round(b/n)}:{r:180,g:120,b:120};
}

function drawCanvas(arch,canvas,mode='live'){
  const as=state[arch],photo=state.photos[arch],ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  if(photo&&as._img){
    ctx.filter=`brightness(${as.brightness}%) contrast(${as.contrast}%) saturate(${as.saturation}%)`;
    ctx.drawImage(as._img,0,0,W,H);ctx.filter='none';
  }else{
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#8b949e';ctx.font='bold 14px system-ui';ctx.textAlign='center';
    ctx.fillText('Upload photo — teeth appear here',W/2,H/2);
  }
  const ppm=as.ppm||6,pl=as.placements.filter(p=>p.placed);
  if(mode==='before'){for(const p of pl)drawOutline(ctx,p,p.origX,p.origY,p.rot||0,'before',false,p,ppm);return;}
  if(mode==='after'){for(const p of pl){if(!p.corrected)continue;drawOutline(ctx,p,p.idealX,p.idealY,0,'after',false,p,ppm);}return;}
  if(photo&&as._img){
    const gum=as.gumColor||sampleGum(ctx,pl);as.gumColor=gum;
    for(const p of pl){
      if(!p.corrected)continue;
      const moved=Math.hypot(p.origX-p.idealX,p.origY-p.idealY)>3||Math.abs(p.rot||0)>1;
      if(!moved)continue;
      ctx.save();ctx.globalAlpha=0.88;
      if(p.polygon&&polyPath(ctx,p.polygon)){ctx.fillStyle=`rgb(${gum.r},${gum.g},${gum.b})`;ctx.fill();}
      else{const grd=ctx.createRadialGradient(p.origX,p.origY,0,p.origX,p.origY,Math.max(p.wPx,p.hPx)*0.55);grd.addColorStop(0,`rgb(${gum.r},${gum.g},${gum.b})`);grd.addColorStop(1,`rgba(${gum.r},${gum.g},${gum.b},0)`);ctx.fillStyle=grd;ctx.beginPath();ctx.ellipse(p.origX,p.origY,(p.wPx||20)*0.6,(p.hPx||28)*0.6,0,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;ctx.restore();
    }
    for(const p of pl)drawSprite(ctx,as._img,p,as);
  }
  for(const p of pl)drawOutline(ctx,p,p.corrected?p.idealX:p.origX,p.corrected?p.idealY:p.origY,p.corrected?0:(p.rot||0),'live',as.selId===p.id,p,ppm);
  const sel=pl.find(p=>p.id===as.selId);
  if(sel&&sel.corrected&&(Math.hypot(sel.origX-sel.idealX,sel.origY-sel.idealY)>4||Math.abs(sel.rot)>1)){ctx.save();ctx.strokeStyle='#2ea043';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.globalAlpha=0.7;ctx.beginPath();ctx.moveTo(sel.origX,sel.origY);ctx.lineTo(sel.idealX,sel.idealY);ctx.stroke();ctx.restore();}
  if(as.mode==='place'){const td=arch==='upper'?UPPER_TEETH:LOWER_TEETH,next=td[as.placeIdx];if(next){ctx.save();ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H-28,W,28);ctx.fillStyle='#fbbf24';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(`👆 Tap to place ${next.label} — ${next.name}`,W/2,H-10);ctx.restore();}}
  const is=IS[arch];if(as.mode==='calib'&&is.calibPt1){ctx.save();ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(is.calibPt1.x,is.calibPt1.y,6,0,Math.PI*2);ctx.fill();ctx.restore();}
  if(as.zoom>1){ctx.save();ctx.fillStyle='rgba(0,0,0,0.6)';ctx.beginPath();ctx.roundRect(W-56,4,52,18,5);ctx.fill();ctx.fillStyle='#58a6ff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(`${as.zoom.toFixed(1)}x`,W-30,17);ctx.restore();}
}

function drawSprite(ctx,img,p,as){
  const w=p.wPx||20,h=p.hPx||28;
  // origX/Y = where tooth is in photo (pixel source, never changes)
  // idealX/Y = where tooth should be (target after correction)
  const destX=p.corrected?p.idealX:p.origX;
  const destY=p.corrected?p.idealY:p.origY;
  const destRot=p.corrected?0:(p.rot||0);
  ctx.save();
  if(p.polygon&&p.polygon.length>2){
    let poly=p.polygon;
    if(p.corrected){
      poly=tpoly(poly,p.idealX-p.origX,p.idealY-p.origY);
      if(Math.abs(p.rot||0)>0.5)poly=rpoly(poly,p.idealX,p.idealY,-(p.rot||0));
    }
    if(polyPath(ctx,poly))ctx.clip();
  }else{
    ctx.translate(destX,destY);ctx.rotate(destRot*Math.PI/180);
    ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,3);ctx.clip();
    ctx.translate(-destX,-destY);
  }
  ctx.translate(destX,destY);ctx.rotate(destRot*Math.PI/180);
  ctx.filter=`brightness(${as.brightness}%) contrast(${as.contrast}%) saturate(${as.saturation}%)`;
  ctx.drawImage(img,p.origX-w/2,p.origY-h/2,w,h,-w/2,-h/2,w,h);
  ctx.filter='none';ctx.restore();
}

function drawOutline(ctx,p,dcx,dcy,drot,mode,isSel,tooth,ppm){
  const w=tooth.wPx||20,h=tooth.hPx||28,color=rc(tooth.rot);
  let stroke,fill,lw;
  if(mode==='before'){stroke='#f85149';fill='rgba(248,81,73,0.18)';lw=1.8;}
  else if(mode==='after'){stroke='#2ea043';fill='rgba(46,160,67,0.18)';lw=1.8;}
  else{stroke=isSel?'#58a6ff':color||(tooth.corrected?'#2ea043':'rgba(203,213,225,0.7)');fill=isSel?'rgba(88,166,255,0.18)':tooth.corrected?'rgba(46,160,67,0.12)':'rgba(33,38,45,0.45)';lw=isSel?2.5:1.8;}
  ctx.save();ctx.translate(dcx,dcy);ctx.rotate(drot*Math.PI/180);
  ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,3);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();
  ctx.font='bold 7px monospace';ctx.fillStyle=isSel?'#58a6ff':tooth.corrected?'#56d364':'#8b949e';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(tooth.label,0,0);
  if(tooth.corrected&&mode==='live'){const tr=tTrays(tooth,ppm);if(tr>0){ctx.fillStyle='#58a6ff';ctx.fillText(tr+'t',0,-h/2-6);}}
  if(isSel){ctx.beginPath();ctx.roundRect(-w/2-4,-h/2-4,w+8,h+8,5);ctx.strokeStyle='rgba(88,166,255,0.4)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#58a6ff';ctx.beginPath();ctx.arc(0,-h/2-12,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(88,166,255,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-h/2-7);ctx.lineTo(0,-h/2);ctx.stroke();}
  ctx.restore();
  if(color&&mode==='live'){ctx.save();ctx.translate(dcx+w/2-2,dcy-h/2+2);ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fill();ctx.restore();}
}

function loadImg(arch){
  const photo=state.photos[arch],as=state[arch];
  if(!photo){as._img=null;return Promise.resolve();}
  return new Promise(res=>{const img=new Image();img.onload=()=>{as._img=img;res();};img.src=photo;});
}

function render(){
  document.getElementById('pat-badge').textContent=state.patName||'';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===state.tab));
  const c=document.getElementById('content');c.innerHTML='';
  if(state.tab===0)c.appendChild(rPhotos());
  else if(state.tab===1)c.appendChild(rArch('upper'));
  else if(state.tab===2)c.appendChild(rArch('lower'));
  else if(state.tab===3)c.appendChild(rQuote());
  else if(state.tab===4)c.appendChild(rReport());

  setTimeout(()=>{['upper','lower'].forEach(arch=>{const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');});bindEvents();},0);
}

function rSlot(id,icon,label,hint){
  const photo=state.photos[id];
  return `<div class="photo-slot" onclick="document.getElementById('file-${id}').click()">
    <div class="photo-slot-thumb ${photo?'filled':''}">

function handlePhoto(id,e){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    state.photos[id]=ev.target.result;
    if(id==='upper'||id==='lower'){
      state[id].aiStatus=null;state[id].aiMsg='';state[id].samStatus=null;state[id].samMsg='';
      state[id].gumColor=null;state[id]._img=null;
      loadImg(id).then(render);
    }else render();
  };
  reader.readAsDataURL(f);
}

function rChips(arch){
  const as=state[arch],pl=as.placements.filter(p=>p.placed).sort((a,b)=>a.id-b.id);

  div.innerHTML=`
    <div class="card" style="text-align:center;padding:22px 16px;background:linear-gradient(135deg,var(--surface),#1a3a23)">
      <div style="font-size:36px;margin-bottom:10px">🦷</div>
      <div style="font-weight:800;font-size:20px;margin-bottom:4px">${esc(state.patName)||'Your Smile Plan'}</div>
      <div style="font-size:12px;color:var(--muted)">AlignerEst™ Treatment Preview</div>
    </div>
    ${state.photos.facial?`<div class="card" style="padding:10px"><span class="sec-label">Your Current Smile</span><img src="${state.photos.facial}" alt="smile" style="width:100%;border-radius:8px;max-height:180px;object-fit:cover;display:block"/></div>`:''}
    ${(up.length||lp.length)?`<div class="card" style="padding:12px"><span class="sec-label">Before &amp; After</span>
      <div class="ba-grid">
        ${up.length?`<div><div class="ba-label" style="color:var(--danger)">🔴 BEFORE — Upper</div><div class="ba-frame"><canvas id="ba-upper-before" width="${CANVAS_W}" height="${CANVAS_H}" style="width:100%;display:block"></canvas></div></div>`:''} 
        ${up.length?`<div><div class="ba-label" style="color:var(--primary)">✅ AFTER — Upper</div><div class="ba-frame"><canvas id="ba-upper-after" width="${CANVAS_W}" height="${CANVAS_H}" style="width:100%;display:block"></canvas></div></div>`:''}
        ${lp.length?`<div><div class="ba-label" style="color:var(--danger)">🔴 BEFORE — Lower</div><div class="ba-frame"><canvas id="ba-lower-before" width="${CANVAS_W}" height="${CANVAS_H}" style="width:100%;display:block"></canvas></div></div>`:''}
        ${lp.length?`<div><div class="ba-label" style="color:var(--primary)">✅ AFTER — Lower</div><div class="ba-frame"><canvas id="ba-lower-after" width="${CANVAS_W}" height="${CANVAS_H}" style="width:100%;display:block"></canvas></div></div>`:''}
      </div></div>`:''}
    <div class="card"><span class="sec-label">Treatment Plan</span>
      <div style="display:grid;grid-template-columns:${uT>0&&lT>0?'1fr 1fr':'1fr'};gap:8px;margin-bottom:10px">
        ${uT>0?`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px;text-align:center"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Upper Arch</div><div style="font-size:26px;font-weight:800">${uT}</div><div style="font-size:11px;color:var(--muted)">trays · ~${uT*2} weeks</div></div>`:''}
        ${lT>0?`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px;text-align:center"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Lower Arch</div><div style="font-size:26px;font-weight:800">${lT}</div><div style="font-size:11px;color:var(--muted)">trays · ~${lT*2} weeks</div></div>`:''}
      </div>
      ${uT>0&&lT>0?`<div style="background:linear-gradient(135deg,var(--accent-dim),#1a3a23);border:1px solid var(--accent);border-radius:10px;padding:13px;text-align:center"><div style="font-size:10px;color:var(--accent);margin-bottom:3px">Combined</div><div style="font-size:22px;font-weight:800;color:var(--accent)">${combT} trays · ~${combT*2} weeks</div></div>`:''}
      ${uT===0&&lT===0?'<div style="color:var(--muted);font-size:13px">Complete arch mapping to see your plan.</div>':''}
    </div>
    <div class="card"><p style="font-size:13px;color:#8b949e;line-height:1.7">Your AlignerEst™ aligners are custom-made, removable, and virtually invisible. Your doctor will confirm the final plan after a full clinical evaluation.</p></div>
    <div class="share-grid">
      <button class="share-btn" onclick="shareR('Text')"><span class="share-btn-icon">📱</span>Text</button>
      <button class="share-btn" onclick="shareR('Email')"><span class="share-btn-icon">📧</span>Email</button>
      <button class="share-btn" onclick="window.print()"><span class="share-btn-icon">🖨️</span>Print</button>
    </div>
    <button class="prim" id="new-case-btn" style="background:var(--surface2);color:var(--muted);border:1px solid var(--border)" onclick="resetCase()">+ Start New Case</button>
    <div style="height:8px"></div>`;
  setTimeout(()=>{['upper','lower'].forEach(arch=>{const b=document.getElementById(`ba-${arch}-before`),a=document.getElementById(`ba-${arch}-after`);if(b)drawCanvas(arch,b,'before');if(a)drawCanvas(arch,a,'after');});},0);
  return div;
}

// ── Canvas events ─────────────────────────────────────────────
function bindEvents(){
  ['upper','lower'].forEach(arch=>{
    const cv=getCV(arch);if(!cv)return;
    const nc=cv.cloneNode(true);cv.parentNode.replaceChild(nc,cv);
    nc.addEventListener('mousedown',e=>mDown(e,arch),{passive:false});
    nc.addEventListener('mousemove',e=>mMove(e,arch),{passive:false});
    nc.addEventListener('mouseup',e=>mUp(e,arch),{passive:false});
    nc.addEventListener('click',e=>mClick(e,arch),{passive:false});
    nc.addEventListener('touchstart',e=>tStart(e,arch),{passive:false});
    nc.addEventListener('touchmove',e=>tMove(e,arch),{passive:false});
    nc.addEventListener('touchend',e=>tEnd(e,arch),{passive:false});
  });
}

function getPt(e,arch){
  const cv=getCV(arch);if(!cv)return null;
  const as=state[arch],rect=cv.getBoundingClientRect();
  const sx=CANVAS_W/rect.width,sy=CANVAS_H/rect.height;
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const clientY=e.touches?e.touches[0].clientY:e.clientY;
  const rx=(clientX-rect.left)*sx,ry=(clientY-rect.top)*sy;
  return{x:(rx-CANVAS_W/2-as.panX)/as.zoom+CANVAS_W/2,y:(ry-CANVAS_H/2-as.panY)/as.zoom+CANVAS_H/2};
}

let mdPos=null,dragging=false;

function mDown(e,arch){
  const as=state[arch],is=IS[arch],pt=getPt(e,arch);if(!pt)return;
  mdPos={x:e.clientX,y:e.clientY};dragging=false;
  if(as.mode==='edit'&&as.selId){
    const sel=as.placements.find(p=>p.id===as.selId);
    if(sel){
      const w=sel.wPx||20,h=sel.hPx||28;
      const dcx=sel.corrected?sel.idealX:sel.origX,dcy=sel.corrected?sel.idealY:sel.origY;
      const hdx=pt.x-dcx,hdy=pt.y-dcy;
      const rotRad=(sel.corrected?0:(sel.rot||0))*Math.PI/180;
      const rotX=hdx*Math.cos(-rotRad)-hdy*Math.sin(-rotRad),rotY=hdx*Math.sin(-rotRad)+hdy*Math.cos(-rotRad);
      if(Math.hypot(rotX,rotY+h/2+12)<10){is.rotHandle={startAngle:Math.atan2(hdy,hdx),startRot:sel.rot||0,toothId:sel.id};e.preventDefault();return;}
      if(Math.abs(rotX)<w/2+4&&Math.abs(rotY)<h/2+4){is.drag={toothId:sel.id,startX:pt.x,startY:pt.y,origX:sel.corrected?sel.idealX:sel.origX,origY:sel.corrected?sel.idealY:sel.origY};e.preventDefault();return;}
    }
  }
}

function mMove(e,arch){
  const as=state[arch],is=IS[arch],pt=getPt(e,arch);if(!pt)return;
  if(mdPos&&!dragging&&Math.hypot(e.clientX-mdPos.x,e.clientY-mdPos.y)>5)dragging=true;
  if(is.rotHandle&&is.rotHandle.toothId){
    const sel=as.placements.find(p=>p.id===is.rotHandle.toothId);
    if(sel){const dcx=sel.corrected?sel.idealX:sel.origX,dcy=sel.corrected?sel.idealY:sel.origY,angle=Math.atan2(pt.y-dcy,pt.x-dcx),delta=(angle-is.rotHandle.startAngle)*180/Math.PI;sel.rot=Math.max(-ROT_MAX,Math.min(ROT_MAX,Math.round((is.rotHandle.startRot+delta)*2)/2));const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');updateRot(arch,sel);e.preventDefault();}
    return;
  }
  if(is.drag&&is.drag.toothId){
    const sel=as.placements.find(p=>p.id===is.drag.toothId);
    if(sel){
      const nx=is.drag.origX+(pt.x-is.drag.startX),ny=is.drag.origY+(pt.y-is.drag.startY);
      if(sel.corrected){sel.idealX=nx;sel.idealY=ny;}
      else{sel.origX=nx;sel.origY=ny;sel.x=nx;sel.y=ny;}
      const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');e.preventDefault();
    }
  }
}

function mUp(e,arch){const is=IS[arch],was=dragging;is.drag=null;is.rotHandle=null;mdPos=null;if(!was)return;dragging=false;render();}
function mClick(e,arch){if(dragging){dragging=false;return;}tap(e,arch);}

function tStart(e,arch){
  const as=state[arch],is=IS[arch];
  if(e.touches.length===2){is.pinchDist=pDist(e.touches);e.preventDefault();return;}
  is.lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};mdPos={x:e.touches[0].clientX,y:e.touches[0].clientY};dragging=false;
  if(as.mode==='edit'&&as.selId){
    const pt=getPt(e,arch);if(pt){const sel=as.placements.find(p=>p.id===as.selId);if(sel){const w=sel.wPx||20,h=sel.hPx||28,dcx=sel.corrected?sel.idealX:sel.origX,dcy=sel.corrected?sel.idealY:sel.origY,hdx=pt.x-dcx,hdy=pt.y-dcy,rotRad=(sel.corrected?0:(sel.rot||0))*Math.PI/180,rotX=hdx*Math.cos(-rotRad)-hdy*Math.sin(-rotRad),rotY=hdx*Math.sin(-rotRad)+hdy*Math.cos(-rotRad);if(Math.hypot(rotX,rotY+h/2+12)<14){is.rotHandle={startAngle:Math.atan2(hdy,hdx),startRot:sel.rot||0,toothId:sel.id};e.preventDefault();return;}if(Math.abs(rotX)<w/2+8&&Math.abs(rotY)<h/2+8){is.drag={toothId:sel.id,startX:pt.x,startY:pt.y,origX:sel.corrected?sel.idealX:sel.origX,origY:sel.corrected?sel.idealY:sel.origY};e.preventDefault();return;}}}
  }
  e.preventDefault();
}

function tMove(e,arch){
  const as=state[arch],is=IS[arch];
  if(e.touches.length===2&&is.pinchDist!=null){const nd=pDist(e.touches);as.zoom=Math.max(1,Math.min(4,as.zoom*nd/is.pinchDist));is.pinchDist=nd;const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');e.preventDefault();return;}
  if(is.rotHandle&&is.rotHandle.toothId){const pt=getPt(e,arch);if(pt){const sel=as.placements.find(p=>p.id===is.rotHandle.toothId);if(sel){const dcx=sel.corrected?sel.idealX:sel.origX,dcy=sel.corrected?sel.idealY:sel.origY,a=Math.atan2(pt.y-dcy,pt.x-dcx),d=(a-is.rotHandle.startAngle)*180/Math.PI;sel.rot=Math.max(-ROT_MAX,Math.min(ROT_MAX,Math.round((is.rotHandle.startRot+d)*2)/2));const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');updateRot(arch,sel);}}e.preventDefault();return;}
  if(is.drag&&is.drag.toothId){const pt=getPt(e,arch);if(pt){const sel=as.placements.find(p=>p.id===is.drag.toothId);if(sel){const nx=is.drag.origX+(pt.x-is.drag.startX),ny=is.drag.origY+(pt.y-is.drag.startY);if(sel.corrected){sel.idealX=nx;sel.idealY=ny;}else{sel.origX=nx;sel.origY=ny;sel.x=nx;sel.y=ny;}if(mdPos&&Math.hypot(e.touches[0].clientX-mdPos.x,e.touches[0].clientY-mdPos.y)>5)dragging=true;const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');}}e.preventDefault();return;}
  if(as.zoom>1&&is.lastTouch){const dx=e.touches[0].clientX-is.lastTouch.x,dy=e.touches[0].clientY-is.lastTouch.y;as.panX+=dx;as.panY+=dy;is.lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};if(Math.abs(dx)>3||Math.abs(dy)>3)dragging=true;const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');e.preventDefault();}
}

function tEnd(e,arch){const is=IS[arch],was=dragging;is.pinchDist=null;if(is.drag||is.rotHandle){is.drag=null;is.rotHandle=null;if(was)render();dragging=false;is.lastTouch=null;return;}if(!was&&is.lastTouch)tap({touches:e.changedTouches,clientX:e.changedTouches[0].clientX,clientY:e.changedTouches[0].clientY},arch);if(was)render();is.lastTouch=null;}
function pDist(t){return Math.sqrt(Math.pow(t[0].clientX-t[1].clientX,2)+Math.pow(t[0].clientY-t[1].clientY,2));}

function tap(e,arch){
  const as=state[arch],is=IS[arch],td=arch==='upper'?UPPER_TEETH:LOWER_TEETH,pt=getPt(e,arch);if(!pt)return;
  if(as.mode==='calib'){
    if(is.calibStep===0){is.calibPt1=pt;is.calibStep=1;const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');}
    else{as.ppm=Math.hypot(pt.x-is.calibPt1.x,pt.y-is.calibPt1.y)/(arch==='upper'?8.5:5.5);as.placements.forEach(p=>{p.wPx=p.widthMm*as.ppm;p.hPx=p.heightMm*as.ppm;});as.mode='edit';is.calibStep=0;is.calibPt1=null;render();}
    return;
  }
  if(as.mode==='place'){
    const next=td[as.placeIdx];if(!next)return;const ppm=as.ppm||6;
    as.placements=as.placements.filter(p=>p.id!==next.id);
    as.placements.push({id:next.id,label:next.label,name:next.name,widthMm:next.widthMm,heightMm:next.heightMm,x:pt.x,y:pt.y,origX:pt.x,origY:pt.y,idealX:pt.x,idealY:pt.y,wPx:next.widthMm*ppm,hPx:next.heightMm*ppm,rot:0,corrected:false,placed:true,polygon:null});
    if(as.placeIdx<td.length-1)as.placeIdx++;else{as.mode='edit';as.selId=null;}
    render();return;
  }
  if(as.mode==='edit'){
    const tapped=as.placements.find(p=>{if(!p.placed)return false;const dcx=p.corrected?p.idealX:p.origX,dcy=p.corrected?p.idealY:p.origY,rot=(p.corrected?0:(p.rot||0))*Math.PI/180,dx=pt.x-dcx,dy=pt.y-dcy,rx=dx*Math.cos(-rot)-dy*Math.sin(-rot),ry=dx*Math.sin(-rot)+dy*Math.cos(-rot);return Math.abs(rx)<=(p.wPx||20)/2+4&&Math.abs(ry)<=(p.hPx||28)/2+4;});
    as.selId=tapped?(as.selId===tapped.id?null:tapped.id):null;render();
  }
}

function updateRot(arch,sel){const s=document.querySelector('.rot-display');if(s){const color=rc(sel.rot),rot=sel.rot||0;s.style.color=color||'var(--accent)';s.textContent=(rot>0?'+':'')+rot.toFixed(1)+'°'+(Math.abs(rot)>=ROT_MAX?' 🛑':'');}}

// ── State helpers ─────────────────────────────────────────────
function setTab(n){state.tab=n;render();}
function setMode(arch,mode){state[arch].mode=mode;state[arch].selId=null;render();}
function jumpTo(arch,idx){state[arch].placeIdx=idx;render();}
function toggleTools(arch){state[arch].showTools=!state[arch].showTools;render();}
function resetZoom(arch){state[arch].zoom=1;state[arch].panX=0;state[arch].panY=0;render();}
function resetPhoto(arch){state[arch].brightness=100;state[arch].contrast=100;state[arch].saturation=100;state[arch].zoom=1;state[arch].panX=0;state[arch].panY=0;render();}
function startCalib(arch){state[arch].mode='calib';IS[arch].calibStep=0;IS[arch].calibPt1=null;render();}
function cancelCalib(arch){state[arch].mode='edit';IS[arch].calibStep=0;IS[arch].calibPt1=null;render();}
function updateProp(arch,prop,val){state[arch][prop]=val;if(['brightness','contrast','saturation'].includes(prop)){const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');document.querySelectorAll('.slider-lbl span:last-child').forEach(el=>{if(el.textContent.endsWith('%'))el.textContent=val+'%';});}else render();}
function setRot(arch,id,val){const p=state[arch].placements.find(p=>p.id===id);if(p){p.rot=Math.max(-ROT_MAX,Math.min(ROT_MAX,Math.round(val*10)/10));const cv=getCV(arch);if(cv)drawCanvas(arch,cv,'live');const s=document.querySelector('.rot-display');if(s){const color=rc(p.rot);s.style.color=color||'var(--accent)';s.textContent=(p.rot>0?'+':'')+p.rot.toFixed(1)+'°'+(Math.abs(p.rot)>=ROT_MAX?' 🛑':'');}}}
function adjPos(arch,id,dx,dy){const p=state[arch].placements.find(p=>p.id===id);if(p){if(p.corrected){p.idealX+=dx;p.idealY+=dy;}else{p.origX+=dx;p.origY+=dy;p.x+=dx;p.y+=dy;}render();}}
function markCorrected(arch){
  const as=state[arch],p=as.placements.find(p=>p.id===as.selId);
  if(p){
    p.corrected=!p.corrected;
    if(p.corrected){
      // Lock in current position as the TARGET
      // origX/Y stays where tooth IS in the photo
      // idealX/Y = where we want it to go (currently same spot — doctor drags to correct)
      p.idealX=p.origX;p.idealY=p.origY;
    }
    render();
  }
}
function correctAll(arch){state[arch].placements.forEach(p=>{if(p.placed&&!p.corrected){p.corrected=true;p.idealX=p.origX;p.idealY=p.origY;}});state[arch].selId=null;render();}
function removeTooth(arch,id){const as=state[arch];as.placements=as.placements.filter(p=>p.id!==id);if(as.selId===id)as.selId=null;const td=arch==='upper'?UPPER_TEETH:LOWER_TEETH,idx=td.findIndex(t=>t.id===id);if(idx!==-1){as.placeIdx=idx;as.mode='place';}render();}
function selTooth(arch,id){state[arch].selId=state[arch].selId===id?null:id;render();}
function resetArch(arch){state[arch]=mkA();state[arch]._img=null;loadImg(arch).then(render);IS[arch]=mkI();}
function resetCase(){state={tab:0,patName:'',patDOB:'',photos:{upper:null,lower:null,facial:null},upper:mkA(),lower:mkA()};IS.upper=mkI();IS.lower=mkI();render();}
function shareR(method){const uT=aTrays(state.upper.placements,state.upper.ppm),lT=aTrays(state.lower.placements,state.lower.ppm),combT=Math.max(uT,lT),name=state.patName||'Patient';if(method==='Email'){window.location.href=`mailto:?subject=${encodeURIComponent('AlignerEst™ — '+name)}&body=${encodeURIComponent('Upper: '+(uT||'—')+' trays\nLower: '+(lT||'—')+' trays\nCombined: '+(combT||'—')+' trays (~'+combT*2+' weeks)\n\nAlignerEst™ by Space Maintainers Laboratories')}`;}else{window.location.href=`sms:?body=${encodeURIComponent('AlignerEst™ for '+name+': '+combT+' trays (~'+combT*2+' weeks). Doctor will confirm.')}`;}
}
function bindInputs(){const n=document.getElementById('inp-name'),d=document.getElementById('inp-dob');if(n)n.addEventListener('input',e=>{state.patName=e.target.value;document.getElementById('pat-badge').textContent=state.patName;});if(d)d.addEventListener('input',e=>{state.patDOB=e.target.value;});}

if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath();return this;};}

render();
</script>
