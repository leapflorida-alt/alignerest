<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>AlignerEst™ — SML Chairside Aligner Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1117;font-family:'DM Sans',system-ui,sans-serif;overscroll-behavior:none;color:#e2e8f0}
input,select,button{font-family:inherit}
button{cursor:pointer;border:none;background:none}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --primary:#2ea043;--primary-dim:#1a5f2a;--accent:#58a6ff;--accent-dim:#1f3a6e;
  --warn:#d29922;--danger:#f85149;--muted:#8b949e;
  --tooth-sel:rgba(88,166,255,0.85);--tooth-done:rgba(46,160,67,0.85);
  --tooth-neutral:rgba(33,38,45,0.88);
}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.inp{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:#e2e8f0;background:var(--surface2);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--accent)}
.prim{background:var(--primary);color:#fff;border-radius:10px;padding:13px;font-size:15px;font-weight:700;width:100%;cursor:pointer;border:none;display:block;text-align:center;letter-spacing:.01em;transition:opacity .15s}
.prim:disabled{opacity:.4;cursor:default}
.prim:hover:not(:disabled){opacity:.88}
.sec-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:block}
input[type=range]{accent-color:var(--accent);width:100%;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:90px}
#header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 0;position:sticky;top:0;z-index:20}
#header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#logo{width:38px;height:38px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
#title-block h1{font-size:17px;font-weight:800;color:#e2e8f0;letter-spacing:-.02em}
#title-block p{font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#pat-badge{font-size:12px;color:var(--accent);font-weight:600;margin-left:auto}
#tabs{display:grid;grid-template-columns:repeat(5,1fr)}
.tab-btn{padding:8px 2px 10px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:10px;font-weight:500;cursor:pointer;transition:color .15s,border-color .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab-icon{font-size:15px;display:block;margin-bottom:2px}
#content{padding:14px 14px 0}
.canvas-wrap{position:relative;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--border);touch-action:none;user-select:none}
.canvas-wrap canvas{display:block;width:100%;height:auto}
.ai-status{border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600}
.ai-status.loading{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent)}
.ai-status.done{background:#1a3a23;border:1px solid var(--primary);color:var(--primary)}
.ai-status.err{background:#3b1e1e;border:1px solid var(--danger);color:var(--danger)}
.ai-spinner{width:16px;height:16px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.edit-panel{padding:12px;border-top:1px solid var(--border)}
.tooth-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tooth-chip{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .1s}
.tooth-chip.placed{border-color:#2ea04366;color:var(--primary)}
.tooth-chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.tooth-chip.corrected{background:#1a3a23;color:var(--primary);border-color:var(--primary)}
.slider-row{margin-bottom:8px}
.slider-lbl{display:flex;justify-content:space-between;margin-bottom:3px;font-size:10px;color:var(--muted)}
.nudge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.nudge-btn{padding:8px 4px;border-radius:8px;background:var(--surface2);color:#c9d1d9;font-size:11px;font-weight:700;border:1px solid var(--border);cursor:pointer}
.nudge-btn:active{background:var(--accent-dim)}
.stats-row{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-bottom:10px}
.sel-actions{display:flex;gap:6px;margin-bottom:10px}
.btn-correct{flex:1;padding:8px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;border:none;background:var(--primary-dim);color:var(--primary)}
.btn-correct.done{background:#1a3a23;color:#56d364}
.btn-remove{padding:8px 12px;border-radius:8px;background:#3b1e1e;color:var(--danger);font-weight:700;font-size:12px;border:1px solid #5a2020;cursor:pointer}
.warn-box{border-radius:8px;padding:6px 10px;margin-bottom:8px;font-size:11px;font-weight:600}
.warn-attach{background:#2d2008;color:var(--warn);border:1px solid #5a4308}
.warn-flag{background:#3b1e1e;color:var(--danger);border:1px solid #5a2020}
.photo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.photo-slot{cursor:pointer}
.photo-slot-thumb{height:88px;border-radius:10px;overflow:hidden;border:2px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .15s}
.photo-slot-thumb.filled{border-color:var(--primary)}
.photo-slot-thumb img{width:100%;height:100%;object-fit:cover}
.photo-slot-check{position:absolute;top:4px;right:4px;background:var(--primary);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
.photo-slot-label{font-size:10px;font-weight:600;color:#c9d1d9;margin-top:4px}
.photo-slot-hint{font-size:9px;color:var(--muted)}
.quote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.quote-cell{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 6px}
.quote-cell-label{font-size:10px;color:var(--muted);margin-bottom:3px}
.quote-cell-val{font-size:22px;font-weight:700}
.quote-cell-sub{font-size:9px;margin-top:2px}
.tray-banner{background:#1a3a23;border:1px solid #2ea04366;border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.tray-rule-box{background:var(--accent-dim);border:1px solid #58a6ff44;border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:11px;color:var(--accent);line-height:1.6}
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ba-label{font-size:9px;font-weight:700;margin-bottom:3px;color:var(--muted)}
.ba-frame{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.ba-frame canvas{display:block;width:100%}
.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.share-btn{padding:12px 8px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--accent);line-height:1.5;cursor:pointer;transition:border-color .15s}
.share-btn:hover{border-color:var(--accent)}
.share-btn-icon{font-size:20px;margin-bottom:3px;display:block}
.prog-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.prog-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
.mode-strip{display:flex;border-bottom:1px solid var(--border);background:var(--surface)}
.mode-btn{flex:1;padding:9px;background:none;color:var(--muted);font-weight:500;font-size:11px;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.mode-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tray-pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:20px;padding:4px 10px;font-size:10px;color:var(--accent);font-weight:600;margin-bottom:8px}
.arch-editor-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.arch-editor-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.arch-editor-title{font-weight:700;font-size:13px;color:#e2e8f0}
.arch-editor-status{font-size:10px;color:var(--muted);margin-top:2px}
.arch-header-badges{display:flex;gap:6px;align-items:center}
.badge-pill{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700}
.tools-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:6px 10px;display:flex;align-items:center;justify-content:space-between}
.tools-btn{font-size:10px;padding:4px 9px;border-radius:6px;background:transparent;color:var(--muted);font-weight:600;border:1px solid transparent;cursor:pointer}
.tools-btn.active{background:var(--surface);border-color:var(--border);color:#c9d1d9}
.tools-panel{padding:10px;border-bottom:1px solid var(--border)}
.quick-actions{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px}
.btn-correct-all{flex:1;padding:8px;border-radius:8px;background:#1a3a23;color:var(--primary);font-size:11px;font-weight:700;border:1px solid #2ea04344;cursor:pointer}
.btn-reset-arch{padding:8px 14px;border-radius:8px;background:#3b1e1e;color:var(--danger);font-size:11px;font-weight:600;border:1px solid #5a2020;cursor:pointer}

/* ── SAM mask indicator ── */
.sam-badge{display:inline-flex;align-items:center;gap:5px;background:#2d1a4a;border:1px solid #8b5cf644;border-radius:20px;padding:3px 9px;font-size:9px;color:#a78bfa;font-weight:700}
.sam-spinner{width:10px;height:10px;border:1.5px solid #a78bfa;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}

/* Settings panel */
.settings-panel{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.settings-label{font-size:12px;font-weight:600;color:#c9d1d9}
.settings-hint{font-size:10px;color:var(--muted);margin-top:2px}

@media print {
  body{background:#fff;color:#000}
  #header,#tabs,.tab-btn,.prim,.btn-correct-all,.btn-reset-arch,.share-grid,#new-case-btn{display:none!important}
  #app{padding:0}
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-top">
      <div id="logo">🦷</div>
      <div id="title-block">
        <h1>AlignerEst™</h1>
        <p>AI Chairside Aligner Tool · SML</p>
      </div>
      <div id="pat-badge"></div>
    </div>
    <div id="tabs">
      <button class="tab-btn active" onclick="setTab(0)"><span class="tab-icon">📷</span>Photos</button>
      <button class="tab-btn" onclick="setTab(1)"><span class="tab-icon">⬆️</span>Upper</button>
      <button class="tab-btn" onclick="setTab(2)"><span class="tab-icon">⬇️</span>Lower</button>
      <button class="tab-btn" onclick="setTab(3)"><span class="tab-icon">💰</span>Quote</button>
      <button class="tab-btn" onclick="setTab(4)"><span class="tab-icon">📋</span>Report</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
//  API KEYS — paste yours here
// ══════════════════════════════════════════════════════════════════
const ANTHROPIC_API_KEY  = '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';
const ROBOFLOW_API_KEY   = 'LgBGguYGe7ZQiBeRResH';
// ══════════════════════════════════════════════════════════════════

// ── Constants ──────────────────────────────────────────────────
const PRICE_PER_TRAY = 65;
const LAB_FEE = 225;
const MARKUP = 1.4;
const CANVAS_W = 680, CANVAS_H = 520;
const ROT_MAX = 30;
const ROT_WARN = 20, ROT_FLAG = 25, ROT_ATTACH = 18;
const DEG_PER_TRAY = 5;
const MM_PER_TRAY = 0.25;

const UPPER_TEETH = [
  { id:6,  label:"#6",  name:"UR Canine",  widthMm:7.5, heightMm:9.6 },
  { id:7,  label:"#7",  name:"UR Lateral", widthMm:6.5, heightMm:8.3 },
  { id:8,  label:"#8",  name:"UR Central", widthMm:8.5, heightMm:10.9 },
  { id:9,  label:"#9",  name:"UL Central", widthMm:8.5, heightMm:10.9 },
  { id:10, label:"#10", name:"UL Lateral", widthMm:6.5, heightMm:8.3 },
  { id:11, label:"#11", name:"UL Canine",  widthMm:7.5, heightMm:9.6 },
];
const LOWER_TEETH = [
  { id:22, label:"#22", name:"LL Canine",  widthMm:6.5, heightMm:8.3 },
  { id:23, label:"#23", name:"LL Lateral", widthMm:6.0, heightMm:7.7 },
  { id:24, label:"#24", name:"LL Central", widthMm:5.5, heightMm:7.1 },
  { id:25, label:"#25", name:"LR Central", widthMm:5.5, heightMm:7.1 },
  { id:26, label:"#26", name:"LR Lateral", widthMm:6.0, heightMm:7.7 },
  { id:27, label:"#27", name:"LR Canine",  widthMm:6.5, heightMm:8.3 },
];

// ── App State ──────────────────────────────────────────────────
let state = {
  tab:0, patName:'', patDOB:'',
  photos:{ upper:null, lower:null, facial:null },
  upper: mkArchState(),
  lower: mkArchState(),
};

function mkArchState() {
  return {
    placements:[], ppm:null, mode:'place', placeIdx:0, selId:null,
    showTools:false, brightness:100, contrast:100, saturation:100,
    zoom:1, panX:0, panY:0,
    aiStatus:null,   // null | 'loading' | 'done' | 'error'
    samStatus:null,  // null | 'loading' | 'done' | 'error'
    aiMsg:'', samMsg:'',
    _img:null,
    gumColor:null,
  };
}

const istate = { upper:mkIState(), lower:mkIState() };
function mkIState() {
  return { isPanning:false, lastTouch:null, pinchDist:null,
           calibStep:0, calibPt1:null, drag:null, rotHandle:null };
}

// ── Tray Math ────────────────────────────────────────────────
function toothTrays(p, ppm) {
  if(!p.corrected||!p.placed) return 0;
  const scale=ppm||6;
  const dx=(p.x-p.idealX)/scale, dy=(p.y-p.idealY)/scale;
  const transMm=Math.sqrt(dx*dx+dy*dy);
  const transTrays=transMm/MM_PER_TRAY;
  const rotTrays=Math.abs(p.rot||0)/DEG_PER_TRAY;
  const total=Math.max(transTrays,rotTrays);
  if(total===0) return 0;
  if(total<1)   return 1;
  return Math.ceil(total);
}
function archTrays(placements,ppm) {
  if(!placements.length) return 0;
  return Math.max(0,...placements.map(t=>toothTrays(t,ppm)));
}
function complexity(t) {
  if(t===0)    return {label:'—',color:'#8b949e'};
  if(t<=4)     return {label:'Simple',color:'#2ea043'};
  if(t<=10)    return {label:'Moderate',color:'#d29922'};
  return             {label:'Complex',color:'#f85149'};
}
function rotColor(rot) {
  const r=Math.abs(rot||0);
  if(r>=ROT_MAX)    return '#f85149';
  if(r>=ROT_FLAG)   return '#e05f40';
  if(r>=ROT_ATTACH) return '#d29922';
  if(r>=ROT_WARN)   return '#ca8a04';
  return null;
}
function labCost(t){return t*PRICE_PER_TRAY+LAB_FEE;}
function drCost(t) {return Math.round(labCost(t)*MARKUP/5)*5;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ══════════════════════════════════════════════════════════════════
//  STEP 1 — CLAUDE VISION: Tooth center detection
// ══════════════════════════════════════════════════════════════════
async function runAIDetection(arch) {
  const photo=state.photos[arch];
  if(!photo) return;
  const as=state[arch];
  as.aiStatus='loading';
  as.aiMsg='Claude Vision is locating teeth…';
  as.samStatus=null; as.samMsg='';
  render();

  try {
    const teethLabels=(arch==='upper'?UPPER_TEETH:LOWER_TEETH)
      .map(t=>`${t.label} (${t.name})`).join(', ');

    const prompt=`You are a dental imaging AI. Analyze this intraoral ${arch} arch photograph.

Identify these teeth: ${teethLabels}

For each tooth visible, return its CENTER point as a fraction of image dimensions (0-1 range).
Also estimate pixels-per-mm scale: tooth #${arch==='upper'?'8':'24'} is ~8.5mm wide (upper central) or 5.5mm wide (lower central).

Respond ONLY with valid JSON, no markdown:
{
  "ppm": <number>,
  "teeth": [
    {"id": <tooth_number>, "cx": <0-1>, "cy": <0-1>, "visible": <true|false>}
  ]
}
Include ALL teeth from the list even if not clearly visible (set visible:false). Order by tooth id.`;

    const body={
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      messages:[{
        role:'user',
        content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:photo.split(',')[1]||photo}},
          {type:'text',text:prompt}
        ]
      }]
    };

    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify(body)
    });

    const data=await resp.json();
    if(!resp.ok) throw new Error(data.error?.message||'Claude API error');

    const text=data.content.map(b=>b.text||'').join('');
    const clean=text.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(clean);

    const teethDefs=arch==='upper'?UPPER_TEETH:LOWER_TEETH;
    as.ppm=parsed.ppm?(parsed.ppm*CANVAS_W/1000):6;
    as.placements=[];

    for(const t of parsed.teeth) {
      if(!t.visible) continue;
      const def=teethDefs.find(d=>d.id===t.id);
      if(!def) continue;
      const ppm=as.ppm||6;
      const x=t.cx*CANVAS_W, y=t.cy*CANVAS_H;
      as.placements.push({
        id:def.id, label:def.label, name:def.name,
        widthMm:def.widthMm, heightMm:def.heightMm,
        x, y, idealX:x, idealY:y,
        wPx:def.widthMm*ppm, hPx:def.heightMm*ppm,
        rot:0, corrected:false, placed:true,
        // SAM polygon mask (null until fetched)
        polygon:null,
        samLoading:false,
      });
    }

    as.placeIdx=as.placements.length;
    as.mode='edit';
    as.aiStatus='done';
    as.aiMsg=`Claude found ${as.placements.length} teeth — running SAM segmentation…`;
    render();

    // ── STEP 2: SAM polygon masks for each tooth ──────────────
    await runSAMSegmentation(arch, photo);

  } catch(err) {
    as.aiStatus='error';
    as.aiMsg='Claude detection failed: '+err.message+'. Place teeth manually.';
    render();
  }
}

// ══════════════════════════════════════════════════════════════════
//  STEP 2 — ROBOFLOW SAM 2: Polygon mask per tooth
// ══════════════════════════════════════════════════════════════════
async function runSAMSegmentation(arch, photoDataUrl) {
  const as=state[arch];
  if(!as.placements.length) return;

  as.samStatus='loading';
  as.samMsg=`SAM segmenting ${as.placements.length} teeth…`;
  render();

  // Strip data URL prefix to get raw base64
  const b64=photoDataUrl.includes(',') ? photoDataUrl.split(',')[1] : photoDataUrl;

  // Roboflow SAM2 endpoint — embed image once, then segment each tooth by point
  const BASE_URL='https://serverless.roboflow.com';
  const IMAGE_ID=`alignerest_${arch}_${Date.now()}`;

  let succeeded=0, failed=0;

  for(const p of as.placements) {
    try {
      p.samLoading=true;

      // Convert canvas coordinates to 0-1 fractions for Roboflow
      const cx_frac = p.x / CANVAS_W;
      const cy_frac = p.y / CANVAS_H;

      // Roboflow SAM2 API: send image + click point, receive polygon mask
      const payload={
        image:{ type:'base64', value:b64 },
        prompts:[{
          type:'point',
          x: cx_frac,
          y: cy_frac,
          label:1   // 1 = foreground (include)
        }],
        image_id: IMAGE_ID + '_' + p.id,
      };

      const resp=await fetch(`${BASE_URL}/sam2/embed_image?api_key=${ROBOFLOW_API_KEY}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });

      if(!resp.ok) {
        throw new Error('SAM HTTP '+resp.status);
      }

      const data=await resp.json();

      // SAM returns masks array; take highest-scoring mask's polygon
      if(data.masks && data.masks.length>0) {
        const mask=data.masks[0]; // best mask
        if(mask.polygon && mask.polygon.length>2) {
          // Scale polygon from 0-1 fractions to canvas pixels
          p.polygon = mask.polygon.map(([fx,fy])=>[fx*CANVAS_W, fy*CANVAS_H]);
          succeeded++;
        } else if(mask.points) {
          // Some SAM responses return flat points array
          const pts=[];
          for(let i=0;i<mask.points.length;i+=2){
            pts.push([mask.points[i]*CANVAS_W, mask.points[i+1]*CANVAS_H]);
          }
          if(pts.length>2) { p.polygon=pts; succeeded++; }
        } else {
          // Build bounding box polygon from mask bounds as fallback
          p.polygon=buildBboxPolygon(p);
          succeeded++;
        }
      } else {
        // No mask returned — fall back to rounded-rect polygon
        p.polygon=buildBboxPolygon(p);
        succeeded++;
      }

    } catch(err) {
      console.warn('SAM failed for tooth',p.label,err.message);
      // Graceful fallback: build bounding-box polygon
      p.polygon=buildBboxPolygon(p);
      failed++;
    } finally {
      p.samLoading=false;
      // Redraw incrementally as each mask arrives
      const cv=getArchCanvas(arch);
      if(cv) drawArchCanvas(arch,cv,'live');
    }
  }

  as.samStatus='done';
  if(failed>0 && succeeded===0) {
    as.samMsg=`SAM unavailable — using bounding boxes. Add Roboflow key for true cutouts.`;
  } else if(failed>0) {
    as.samMsg=`${succeeded} teeth segmented with SAM polygons, ${failed} using bounding box fallback.`;
  } else {
    as.samMsg=`✓ ${succeeded} tooth polygons — real cutout edges active`;
  }
  render();
}

// Build a rounded-rectangle polygon as SAM fallback (8-point approximation)
function buildBboxPolygon(p) {
  const w=p.wPx||20, h=p.hPx||28, r=3;
  const cx=p.x, cy=p.y;
  const l=cx-w/2, t=cy-h/2, ri=cx+w/2, b=cy+h/2;
  return [
    [l+r,t],[ri-r,t],[ri,t+r],[ri,b-r],[ri-r,b],[l+r,b],[l,b-r],[l,t+r]
  ];
}

// ── Translate polygon by (dx,dy) ─────────────────────────────
function translatePolygon(poly, dx, dy) {
  if(!poly) return null;
  return poly.map(([x,y])=>[x+dx,y+dy]);
}

// ── Rotate polygon around center (cx,cy) by deg ──────────────
function rotatePolygon(poly, cx, cy, deg) {
  if(!poly) return null;
  const rad=deg*Math.PI/180;
  const cos=Math.cos(rad), sin=Math.sin(rad);
  return poly.map(([x,y])=>{
    const dx=x-cx, dy=y-cy;
    return [cx+dx*cos-dy*sin, cy+dx*sin+dy*cos];
  });
}

// ══════════════════════════════════════════════════════════════════
//  CANVAS RENDERING — polygon-clipped tooth sprites
// ══════════════════════════════════════════════════════════════════
function getArchCanvas(arch) { return document.getElementById('canvas-main-'+arch); }

function sampleGumColor(ctx, placements) {
  const w=CANVAS_W, h=CANVAS_H;
  const samples=[[20,20],[w-20,20],[w/2,h-20],[20,h-20]];
  let r=0,g=0,b=0,n=0;
  for(const [sx,sy] of samples) {
    const near=placements.some(p=>Math.hypot(p.x-sx,p.y-sy)<30);
    if(!near){const d=ctx.getImageData(sx,sy,1,1).data;r+=d[0];g+=d[1];b+=d[2];n++;}
  }
  if(!n) return {r:180,g:120,b:120};
  return {r:Math.round(r/n),g:Math.round(g/n),b:Math.round(b/n)};
}

// Apply a polygon path to the canvas context (for clipping or drawing)
function applyPolygonPath(ctx, poly) {
  if(!poly||poly.length<3) return false;
  ctx.beginPath();
  ctx.moveTo(poly[0][0], poly[0][1]);
  for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i][0],poly[i][1]);
  ctx.closePath();
  return true;
}

function drawArchCanvas(arch, canvas, mode='live') {
  const as=state[arch];
  const photo=state.photos[arch];
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  if(photo && as._img) {
    ctx.filter=`brightness(${as.brightness}%) contrast(${as.contrast}%) saturate(${as.saturation}%)`;
    ctx.drawImage(as._img,0,0,W,H);
    ctx.filter='none';
  } else {
    ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#8b949e'; ctx.font='bold 14px DM Sans,system-ui'; ctx.textAlign='center';
    ctx.fillText('Upload photo — teeth appear here',W/2,H/2-10);
    ctx.font='11px DM Sans,system-ui'; ctx.fillStyle='#30363d';
    ctx.fillText('Real patient photo with polygon-accurate tooth cutouts',W/2,H/2+10);
  }

  const ppm=as.ppm||6;
  const placements=as.placements.filter(p=>p.placed);

  // ── BEFORE mode: red outlines at original positions ──────────
  if(mode==='before') {
    for(const p of placements) {
      drawToothOutline(ctx,p,p.x,p.y,p.rot||0,'before',false,p,ppm);
    }
    return;
  }

  // ── AFTER mode: green outlines at ideal positions ─────────────
  if(mode==='after') {
    for(const p of placements) {
      if(!p.corrected) continue;
      drawToothOutline(ctx,p,p.idealX,p.idealY,0,'after',false,p,ppm);
    }
    return;
  }

  // ── LIVE mode: polygon-clipped sprites ───────────────────────
  if(photo && as._img) {
    const gum=as.gumColor||sampleGumColor(ctx,placements);
    as.gumColor=gum;

    // Pass 1: fill gum color at old positions of moved/corrected teeth
    for(const p of placements) {
      if(!p.corrected) continue;
      const moved=Math.hypot(p.x-p.idealX,p.y-p.idealY)>3||Math.abs(p.rot||0)>1;
      if(!moved) continue;

      ctx.save();
      ctx.globalAlpha=0.88;
      // If we have a polygon, use it as the gum-fill shape
      if(p.polygon) {
        const filled=applyPolygonPath(ctx,p.polygon);
        if(filled){ctx.fillStyle=`rgb(${gum.r},${gum.g},${gum.b})`;ctx.fill();}
      } else {
        const grd=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,Math.max(p.wPx,p.hPx)*0.55);
        grd.addColorStop(0,`rgb(${gum.r},${gum.g},${gum.b})`);
        grd.addColorStop(1,`rgba(${gum.r},${gum.g},${gum.b},0)`);
        ctx.fillStyle=grd; ctx.beginPath();
        ctx.ellipse(p.x,p.y,(p.wPx||20)*0.6,(p.hPx||28)*0.6,0,0,Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.restore();
    }

    // Pass 2: draw each tooth sprite, clipped to its polygon
    for(const p of placements) {
      drawToothSpritePolygon(ctx,as._img,p,as,W,H);
    }
  }

  // Pass 3: outline overlays
  for(const p of placements) {
    const tx=p.corrected?p.idealX:p.x;
    const ty=p.corrected?p.idealY:p.y;
    const trot=p.corrected?0:(p.rot||0);
    drawToothOutline(ctx,p,tx,ty,trot,'live',as.selId===p.id,p,ppm);
  }

  // Movement arrow for selected corrected tooth
  const sel=placements.find(p=>p.id===as.selId);
  if(sel&&sel.corrected&&(Math.hypot(sel.x-sel.idealX,sel.y-sel.idealY)>4||Math.abs(sel.rot)>1)) {
    ctx.save();
    ctx.strokeStyle='#2ea043';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.globalAlpha=0.7;
    ctx.beginPath();ctx.moveTo(sel.x,sel.y);ctx.lineTo(sel.idealX,sel.idealY);ctx.stroke();
    ctx.restore();
  }

  // Place mode instruction bar
  if(as.mode==='place') {
    const teethDefs=arch==='upper'?UPPER_TEETH:LOWER_TEETH;
    const next=teethDefs[as.placeIdx];
    if(next){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H-28,W,28);
      ctx.fillStyle='#fbbf24';ctx.font='bold 11px DM Sans,system-ui';ctx.textAlign='center';
      ctx.fillText(`👆 Tap to place ${next.label} — ${next.name}`,W/2,H-10);
      ctx.restore();
    }
  }

  // Calibration point
  const is=istate[arch];
  if(as.mode==='calib'&&is.calibPt1){
    ctx.save();ctx.fillStyle='#fbbf24';ctx.beginPath();
    ctx.arc(is.calibPt1.x,is.calibPt1.y,6,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // Zoom indicator
  if(as.zoom>1){
    ctx.save();ctx.fillStyle='rgba(0,0,0,0.6)';ctx.beginPath();
    ctx.roundRect(W-56,4,52,18,5);ctx.fill();
    ctx.fillStyle='#58a6ff';ctx.font='bold 10px DM Sans,system-ui';ctx.textAlign='center';
    ctx.fillText(`${as.zoom.toFixed(1)}x`,W-30,17);ctx.restore();
  }
}

// ── Polygon-clipped tooth sprite (the key rendering function) ──
function drawToothSpritePolygon(ctx, img, p, as, W, H) {
  const isCorr=p.corrected;
  // Destination: where to draw (ideal position if corrected, else current)
  const destX=isCorr?p.idealX:p.x;
  const destY=isCorr?p.idealY:p.y;
  const destRot=isCorr?0:(p.rot||0);

  // Source crop: always from original position in the photo
  const srcX=p.x, srcY=p.y;

  ctx.save();

  if(p.polygon && p.polygon.length>2) {
    // ── TRUE POLYGON CLIP (SAM mask) ───────────────────────────
    // The polygon is stored in original-photo coords.
    // If tooth has moved, we translate + rotate the polygon to the destination.
    let drawPoly=p.polygon;

    if(isCorr) {
      // Translate from original position to ideal position
      const ddx=p.idealX-p.x, ddy=p.idealY-p.y;
      drawPoly=translatePolygon(p.polygon, ddx, ddy);
      // If there's rotation correction (rot→0), rotate polygon around ideal center
      if(Math.abs(p.rot||0)>0.5) {
        drawPoly=rotatePolygon(drawPoly, p.idealX, p.idealY, -(p.rot||0));
      }
    }

    // Clip to the polygon shape
    if(applyPolygonPath(ctx, drawPoly)) {
      ctx.clip();
    }

    // Draw the photo crop, rotated and translated
    ctx.translate(destX, destY);
    ctx.rotate(destRot*Math.PI/180);
    const w=p.wPx||20, h=p.hPx||28;
    ctx.filter=`brightness(${as.brightness}%) contrast(${as.contrast}%) saturate(${as.saturation}%)`;
    // Source rectangle centered on original tooth position
    ctx.drawImage(img, srcX-w/2, srcY-h/2, w, h, -w/2, -h/2, w, h);
    ctx.filter='none';

  } else {
    // ── FALLBACK: rounded-rect clip ────────────────────────────
    const w=p.wPx||20, h=p.hPx||28;
    ctx.translate(destX, destY);
    ctx.rotate(destRot*Math.PI/180);
    ctx.beginPath();
    ctx.roundRect(-w/2,-h/2,w,h,3);
    ctx.clip();
    ctx.filter=`brightness(${as.brightness}%) contrast(${as.contrast}%) saturate(${as.saturation}%)`;
    ctx.drawImage(img, srcX-w/2, srcY-h/2, w, h, -w/2, -h/2, w, h);
    ctx.filter='none';
  }

  ctx.restore();
}

function drawToothOutline(ctx, p, cx, cy, rot, mode, isSel, tooth, ppm) {
  const w=tooth.wPx||20, h=tooth.hPx||28;
  const rc=rotColor(tooth.rot);
  let stroke,fill,lw;
  if(mode==='before'){stroke='#f85149';fill='rgba(248,81,73,0.18)';lw=1.8;}
  else if(mode==='after'){stroke='#2ea043';fill='rgba(46,160,67,0.18)';lw=1.8;}
  else {
    stroke=isSel?'#58a6ff':rc?rc:tooth.corrected?'#2ea043':'rgba(203,213,225,0.7)';
    fill=isSel?'rgba(88,166,255,0.18)':tooth.corrected?'rgba(46,160,67,0.12)':'rgba(33,38,45,0.45)';
    lw=isSel?2.5:1.8;
  }
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot*Math.PI/180);
  ctx.beginPath();
  ctx.roundRect(-w/2,-h/2,w,h,3);
  ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();
  ctx.font='bold 7px DM Sans,monospace';
  ctx.fillStyle=isSel?'#58a6ff':tooth.corrected?'#56d364':'#8b949e';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(tooth.label,0,0);
  if(tooth.corrected&&mode==='live'){
    const trays=toothTrays(tooth,ppm);
    if(trays>0){ctx.font='bold 7px DM Sans,monospace';ctx.fillStyle='#58a6ff';ctx.fillText(trays+'t',0,-h/2-6);}
  }
  if(isSel){
    ctx.beginPath();ctx.roundRect(-w/2-4,-h/2-4,w+8,h+8,5);
    ctx.strokeStyle='rgba(88,166,255,0.4)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#58a6ff';ctx.beginPath();ctx.arc(0,-h/2-12,5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(88,166,255,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,-h/2-7);ctx.lineTo(0,-h/2);ctx.stroke();
  }
  ctx.restore();
  if(rc&&mode==='live'){
    ctx.save();ctx.translate(cx+w/2-2,cy-h/2+2);
    ctx.fillStyle=rc;ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

// ── Image loading ─────────────────────────────────────────────
function loadArchImage(arch) {
  const photo=state.photos[arch];
  const as=state[arch];
  if(!photo){as._img=null;return Promise.resolve();}
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{as._img=img;res();};
    img.src=photo;
  });
}

function render() {
  document.getElementById('pat-badge').textContent=state.patName||'';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===state.tab));
  const c=document.getElementById('content');
  c.innerHTML='';
  if(state.tab===0) c.appendChild(renderPhotosTab());
  else if(state.tab===1) c.appendChild(renderArchTab('upper'));
  else if(state.tab===2) c.appendChild(renderArchTab('lower'));
  else if(state.tab===3) c.appendChild(renderQuoteTab());
  else if(state.tab===4) c.appendChild(renderReportTab());
  bindInputs();
  setTimeout(()=>{
    ['upper','lower'].forEach(arch=>{
      const cv=getArchCanvas(arch);
      if(cv) drawArchCanvas(arch,cv,'live');
    });
    bindCanvasEvents();
  },0);
}

function handlePhoto(id,e) {
  const f=e.target.files[0];
  if(!f) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    state.photos[id]=ev.target.result;
    if(id==='upper'||id==='lower'){
      state[id].aiStatus=null;state[id].aiMsg='';
      state[id].samStatus=null;state[id].samMsg='';
      state[id].gumColor=null;state[id]._img=null;
      loadArchImage(id).then(render);
    } else { render(); }
  };
  reader.readAsDataURL(f);
}

  const corrected=as.placements.filter(p=>p.corrected);

  const sel=as.placements.find(p=>p.id===as.selId);
  const complexC=complexity(trayCount);
  const hasSAM=placed.some(p=>p.polygon&&p.polygon.length>4);

  let statusText='';
  if(as.mode==='calib') statusText=`📐 Calibration step ${istate[arch].calibStep+1}/2`;

  const rotTrays=(Math.abs(rot)/DEG_PER_TRAY).toFixed(1);

      <button class="nudge-btn" onclick="adjPos('${arch}',${sel.id},-3,0)">← M</button>
      <button class="nudge-btn" onclick="adjPos('${arch}',${sel.id},3,0)">D →</button>

function renderPlacedChips(arch) {
  const as=state[arch];
  const placed=as.placements.filter(p=>p.placed).sort((a,b)=>a.id-b.id);

  return `<div class="tooth-row" style="margin-top:8px">
    ${placed.map(p=>{
      const t=toothTrays(p,as.ppm||6);
      const hasPoly=p.polygon&&p.polygon.length>4;
      return `<div class="tooth-chip ${as.selId===p.id?'sel':''} ${p.corrected?'corrected':''}" onclick="selectTooth('${arch}',${p.id})" title="${hasPoly?'SAM polygon':'bounding box'}">${p.label}${t>0?` ${t}t`:''}</div>`;
    }).join('')}

}

// ── Canvas event handling ─────────────────────────────────────
function bindCanvasEvents() {
  ['upper','lower'].forEach(arch=>{
    const cv=getArchCanvas(arch);
    if(!cv) return;
    const newCv=cv.cloneNode(true);
    cv.parentNode.replaceChild(newCv,cv);
    const canvas=newCv;
    canvas.addEventListener('mousedown',e=>handleMouseDown(e,arch),{passive:false});
    canvas.addEventListener('mousemove',e=>handleMouseMove(e,arch),{passive:false});
    canvas.addEventListener('mouseup',e=>handleMouseUp(e,arch),{passive:false});
    canvas.addEventListener('click',e=>handleCanvasClick(e,arch),{passive:false});
    canvas.addEventListener('touchstart',e=>handleTouchStart(e,arch),{passive:false});
    canvas.addEventListener('touchmove',e=>handleTouchMove(e,arch),{passive:false});
    canvas.addEventListener('touchend',e=>handleTouchEnd(e,arch),{passive:false});
  });
}

function getCanvasPoint(e,arch) {
  const canvas=getArchCanvas(arch); if(!canvas) return null;
  const as=state[arch];
  const rect=canvas.getBoundingClientRect();
  const scaleX=CANVAS_W/rect.width, scaleY=CANVAS_H/rect.height;
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const clientY=e.touches?e.touches[0].clientY:e.clientY;
  const rawX=(clientX-rect.left)*scaleX;
  const rawY=(clientY-rect.top)*scaleY;
  return {
    x:(rawX-CANVAS_W/2-as.panX)/as.zoom+CANVAS_W/2,
    y:(rawY-CANVAS_H/2-as.panY)/as.zoom+CANVAS_H/2,
  };
}

let mouseDownPos=null, isDragging=false;

function handleMouseDown(e,arch) {
  const as=state[arch]; const is=istate[arch];
  const pt=getCanvasPoint(e,arch); if(!pt) return;
  mouseDownPos={x:e.clientX,y:e.clientY}; isDragging=false;
  if(as.mode==='edit'&&as.selId){
    const sel=as.placements.find(p=>p.id===as.selId);
    if(sel){
      const w=sel.wPx||20, h=sel.hPx||28;
      const hdx=pt.x-(sel.corrected?sel.idealX:sel.x);
      const hdy=pt.y-(sel.corrected?sel.idealY:sel.y);
      const rotRad=(sel.corrected?0:(sel.rot||0))*Math.PI/180;
      const rotX=hdx*Math.cos(-rotRad)-hdy*Math.sin(-rotRad);
      const rotY=hdx*Math.sin(-rotRad)+hdy*Math.cos(-rotRad);
      if(Math.hypot(rotX,rotY+h/2+12)<10){
        is.rotHandle={startAngle:Math.atan2(hdy,hdx),startRot:sel.rot||0,toothId:sel.id};
        e.preventDefault(); return;
      }
      if(Math.abs(rotX)<w/2+4&&Math.abs(rotY)<h/2+4){
        is.drag={toothId:sel.id,startX:pt.x,startY:pt.y,origX:sel.x,origY:sel.y};
        e.preventDefault(); return;
      }
    }
  }
}

function handleMouseMove(e,arch) {
  const as=state[arch]; const is=istate[arch];
  const pt=getCanvasPoint(e,arch); if(!pt) return;
  if(mouseDownPos&&!isDragging){const d=Math.hypot(e.clientX-mouseDownPos.x,e.clientY-mouseDownPos.y);if(d>5)isDragging=true;}
  if(is.rotHandle&&is.rotHandle.toothId){
    const sel=as.placements.find(p=>p.id===is.rotHandle.toothId);
    if(sel){
      const cx=sel.corrected?sel.idealX:sel.x, cy=sel.corrected?sel.idealY:sel.y;
      const angle=Math.atan2(pt.y-cy,pt.x-cx);
      const delta=(angle-is.rotHandle.startAngle)*180/Math.PI;
      sel.rot=Math.max(-ROT_MAX,Math.min(ROT_MAX,Math.round((is.rotHandle.startRot+delta)*2)/2));
      const cv=getArchCanvas(arch); if(cv) drawArchCanvas(arch,cv,'live');
      updateEditPanelLive(arch,sel); e.preventDefault();
    }
    return;
  }
  if(is.drag&&is.drag.toothId){
    const sel=as.placements.find(p=>p.id===is.drag.toothId);
    if(sel){
      const dx=pt.x-is.drag.startX, dy=pt.y-is.drag.startY;
      sel.x=is.drag.origX+dx; sel.y=is.drag.origY+dy;
      if(sel.corrected){sel.idealX=sel.x;sel.idealY=sel.y;}
      const cv=getArchCanvas(arch); if(cv) drawArchCanvas(arch,cv,'live');
      e.preventDefault();
    }
  }
}

function handleMouseUp(e,arch) {
  const is=istate[arch]; const wasDrag=isDragging;
  is.drag=null; is.rotHandle=null; mouseDownPos=null;
  if(!wasDrag) return;
  isDragging=false; render();
}

function handleCanvasClick(e,arch) {
  if(isDragging){isDragging=false;return;}
  processCanvasTap(e,arch);
}

function handleTouchStart(e,arch) {
  const as=state[arch]; const is=istate[arch];
  if(e.touches.length===2){
    is.pinchDist=getPinchDist(e.touches);
    is.isPanning=false; e.preventDefault(); return;
  }
  is.lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};
  mouseDownPos={x:e.touches[0].clientX,y:e.touches[0].clientY}; isDragging=false;
  if(as.mode==='edit'&&as.selId){
    const pt=getCanvasPoint(e,arch);
    if(pt){
      const sel=as.placements.find(p=>p.id===as.selId);
      if(sel){
        const w=sel.wPx||20,h=sel.hPx||28;
        const hdx=pt.x-(sel.corrected?sel.idealX:sel.x);
        const hdy=pt.y-(sel.corrected?sel.idealY:sel.y);
        const rotRad=(sel.corrected?0:(sel.rot||0))*Math.PI/180;
        const rotX=hdx*Math.cos(-rotRad)-hdy*Math.sin(-rotRad);
        const rotY=hdx*Math.sin(-rotRad)+hdy*Math.cos(-rotRad);
        if(Math.hypot(rotX,rotY+h/2+12)<14){
          is.rotHandle={startAngle:Math.atan2(hdy,hdx),startRot:sel.rot||0,toothId:sel.id};
          e.preventDefault(); return;
        }
        if(Math.abs(rotX)<w/2+8&&Math.abs(rotY)<h/2+8){
          is.drag={toothId:sel.id,startX:pt.x,startY:pt.y,origX:sel.x,origY:sel.y};
          e.preventDefault(); return;
        }
      }
    }
  }
  e.preventDefault();
}

function handleTouchMove(e,arch) {
  const as=state[arch]; const is=istate[arch];
  if(e.touches.length===2&&is.pinchDist!=null){
    const newDist=getPinchDist(e.touches);
    const ratio=newDist/is.pinchDist;
    as.zoom=Math.max(1,Math.min(4,as.zoom*ratio));
    is.pinchDist=newDist;
    const cv=getArchCanvas(arch); if(cv) drawArchCanvas(arch,cv,'live');
    e.preventDefault(); return;
  }
  if(is.rotHandle&&is.rotHandle.toothId){
    const pt=getCanvasPoint(e,arch);
    if(pt){
      const sel=as.placements.find(p=>p.id===is.rotHandle.toothId);
      if(sel){
        const cx=sel.corrected?sel.idealX:sel.x,cy=sel.corrected?sel.idealY:sel.y;
        const angle=Math.atan2(pt.y-cy,pt.x-cx);
        const delta=(angle-is.rotHandle.startAngle)*180/Math.PI;
        sel.rot=Math.max(-ROT_MAX,Math.min(ROT_MAX,Math.round((is.rotHandle.startRot+delta)*2)/2));
        const cv=getArchCanvas(arch); if(cv) drawArchCanvas(arch,cv,'live');
        updateEditPanelLive(arch,sel);
      }
    }
    e.preventDefault(); return;
  }
  if(is.drag&&is.drag.toothId){
    const pt=getCanvasPoint(e,arch);
    if(pt){
      const sel=as.placements.find(p=>p.id===is.drag.toothId);
      if(sel){
        const dx=pt.x-is.drag.startX,dy=pt.y-is.drag.startY;
        sel.x=is.drag.origX+dx; sel.y=is.drag.origY+dy;
        if(sel.corrected){sel.idealX=sel.x;sel.idealY=sel.y;}
        if(mouseDownPos){const d=Math.hypot(e.touches[0].clientX-mouseDownPos.x,e.touches[0].clientY-mouseDownPos.y);if(d>5)isDragging=true;}
        const cv=getArchCanvas(arch); if(cv) drawArchCanvas(arch,cv,'live');
      }
    }
    e.preventDefault(); return;
  }
  if(as.zoom>1&&is.lastTouch){
    const dx=e.touches[0].clientX-is.lastTouch.x;
    const dy=e.touches[0].clientY-is.lastTouch.y;
    as.panX+=dx; as.panY+=dy;
    is.lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
    if(Math.abs(dx)>3||Math.abs(dy)>3) isDragging=true;
    const cv=getArchCanvas(arch); if(cv) drawArchCanvas(arch,cv,'live');
    e.preventDefault();
  }
}

function handleTouchEnd(e,arch) {
  const is=istate[arch]; const hadDrag=isDragging;
  is.pinchDist=null;
  if(is.drag||is.rotHandle){is.drag=null;is.rotHandle=null;if(hadDrag)render();isDragging=false;is.isPanning=false;is.lastTouch=null;return;}
  if(!hadDrag&&is.lastTouch){processCanvasTap({touches:e.changedTouches,clientX:e.changedTouches[0].clientX,clientY:e.changedTouches[0].clientY},arch);}
  if(hadDrag) render();
  is.isPanning=false; is.lastTouch=null;
}

function getPinchDist(touches){const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;return Math.sqrt(dx*dx+dy*dy);}

function processCanvasTap(e,arch) {
  const as=state[arch]; const is=istate[arch];
  const teethDefs=arch==='upper'?UPPER_TEETH:LOWER_TEETH;
  const pt=getCanvasPoint(e,arch); if(!pt) return;

  if(as.mode==='calib'){
    if(is.calibStep===0){is.calibPt1=pt;is.calibStep=1;const cv=getArchCanvas(arch);if(cv)drawArchCanvas(arch,cv,'live');}
    else {
      const refTooth=arch==='upper'?8.5:5.5;
      const dist=Math.hypot(pt.x-is.calibPt1.x,pt.y-is.calibPt1.y);
      as.ppm=dist/refTooth;
      as.placements.forEach(p=>{p.wPx=p.widthMm*as.ppm;p.hPx=p.heightMm*as.ppm;});
      as.mode='edit';is.calibStep=0;is.calibPt1=null;render();
    }
    return;
  }

  if(as.mode==='place'){
    const next=teethDefs[as.placeIdx]; if(!next) return;
    const ppm=as.ppm||6;
    as.placements=as.placements.filter(p=>p.id!==next.id);
    as.placements.push({
      id:next.id,label:next.label,name:next.name,
      widthMm:next.widthMm,heightMm:next.heightMm,
      x:pt.x,y:pt.y,idealX:pt.x,idealY:pt.y,
      wPx:next.widthMm*ppm,hPx:next.heightMm*ppm,
      rot:0,corrected:false,placed:true,
      polygon:null,samLoading:false,
    });
    if(as.placeIdx<teethDefs.length-1){as.placeIdx++;}
    else{as.mode='edit';as.selId=null;}
    render(); return;
  }

  if(as.mode==='edit'){
    const tapped=as.placements.find(p=>{
      if(!p.placed) return false;
      const cx=p.corrected?p.idealX:p.x, cy=p.corrected?p.idealY:p.y;
      const rot=(p.corrected?0:(p.rot||0))*Math.PI/180;
      const dx=pt.x-cx, dy=pt.y-cy;
      const rx=dx*Math.cos(-rot)-dy*Math.sin(-rot);
      const ry=dx*Math.sin(-rot)+dy*Math.cos(-rot);
      return Math.abs(rx)<=(p.wPx||20)/2+4&&Math.abs(ry)<=(p.hPx||28)/2+4;
    });
    as.selId=tapped?(as.selId===tapped.id?null:tapped.id):null;
    render();
  }
}

function updateEditPanelLive(arch,sel) {
  const rotSpan=document.querySelector('.rot-display');
  if(rotSpan){
    const rc=rotColor(sel.rot), rot=sel.rot||0;
    rotSpan.style.color=rc||'var(--accent)';
    rotSpan.textContent=(rot>0?'+':'')+rot.toFixed(1)+'°'+(Math.abs(rot)>=ROT_MAX?' 🛑':'');
  }
}

// ── State helpers ─────────────────────────────────────────────
function setTab(n){state.tab=n;render();}
function setArchMode(arch,mode){state[arch].mode=mode;state[arch].selId=null;render();}
function jumpToTooth(arch,idx){state[arch].placeIdx=idx;render();}
function togglePhotoTools(arch){state[arch].showTools=!state[arch].showTools;render();}
function resetZoom(arch){state[arch].zoom=1;state[arch].panX=0;state[arch].panY=0;render();}
function resetPhoto(arch){state[arch].brightness=100;state[arch].contrast=100;state[arch].saturation=100;state[arch].zoom=1;state[arch].panX=0;state[arch].panY=0;render();}
function startCalib(arch){state[arch].mode='calib';istate[arch].calibStep=0;istate[arch].calibPt1=null;render();}
function cancelCalib(arch){state[arch].mode='edit';istate[arch].calibStep=0;istate[arch].calibPt1=null;render();}

function updateProp(arch,prop,val){
  state[arch][prop]=val;
  if(['brightness','contrast','saturation'].includes(prop)){
    const cv=getArchCanvas(arch);if(cv) drawArchCanvas(arch,cv,'live');
    document.querySelectorAll('.slider-lbl span:last-child').forEach(el=>{if(el.textContent.endsWith('%'))el.textContent=val+'%';});
  } else render();
}

function setRot(arch,id,val){
  const p=state[arch].placements.find(p=>p.id===id);
  if(p){
    p.rot=Math.max(-ROT_MAX,Math.min(ROT_MAX,Math.round(val*10)/10));
    const cv=getArchCanvas(arch);if(cv) drawArchCanvas(arch,cv,'live');
    const rotSpan=document.querySelector('.rot-display');
    if(rotSpan){const rc=rotColor(p.rot);rotSpan.style.color=rc||'var(--accent)';rotSpan.textContent=(p.rot>0?'+':'')+p.rot.toFixed(1)+'°'+(Math.abs(p.rot)>=ROT_MAX?' 🛑':'');}
  }
}

function adjPos(arch,id,dx,dy){
  const p=state[arch].placements.find(p=>p.id===id);
  if(p){p.x+=dx;p.y+=dy;if(p.corrected){p.idealX=p.x;p.idealY=p.y;}render();}
}

function markCorrected(arch){
  const as=state[arch];
  const p=as.placements.find(p=>p.id===as.selId);
  if(p){p.corrected=!p.corrected;if(p.corrected){p.idealX=p.x;p.idealY=p.y;}render();}
}

function correctAll(arch){
  state[arch].placements.forEach(p=>{if(p.placed&&!p.corrected){p.corrected=true;p.idealX=p.x;p.idealY=p.y;}});
  state[arch].selId=null;render();
}

function removeTooth(arch,id){
  const as=state[arch];
  as.placements=as.placements.filter(p=>p.id!==id);
  if(as.selId===id) as.selId=null;
  const teethDefs=arch==='upper'?UPPER_TEETH:LOWER_TEETH;
  const idx=teethDefs.findIndex(t=>t.id===id);
  if(idx!==-1){as.placeIdx=idx;as.mode='place';}
  render();
}

function selectTooth(arch,id){state[arch].selId=state[arch].selId===id?null:id;render();}

function resetArch(arch){
  state[arch]=mkArchState();state[arch]._img=null;
  loadArchImage(arch).then(render);istate[arch]=mkIState();
}

function resetCase(){
  state={tab:0,patName:'',patDOB:'',photos:{upper:null,lower:null,facial:null},upper:mkArchState(),lower:mkArchState()};
  istate.upper=mkIState();istate.lower=mkIState();render();
}

function shareReport(method){
  const uT=archTrays(state.upper.placements,state.upper.ppm);
  const lT=archTrays(state.lower.placements,state.lower.ppm);
  const combT=Math.max(uT,lT);
  const name=state.patName||'Patient';
  if(method==='Email'){
    const subject=encodeURIComponent(`AlignerEst™ Treatment Plan — ${name}`);
    const body=encodeURIComponent(`AlignerEst™ Aligner Treatment Plan\n\nPatient: ${name}\nDate of Birth: ${state.patDOB||'—'}\n\nUpper Arch: ${uT||'—'} trays (~${uT*2} weeks)\nLower Arch: ${lT||'—'} trays (~${lT*2} weeks)\nCombined: ${combT||'—'} trays (~${combT*2} weeks)\n\nBased on 5°/tray rotation and 0.25mm/tray translation.\nThis estimate is based on visual assessment and subject to clinical review.\nAlignerEst™ is a tool by Space Maintainers Laboratories.`);
    window.location.href=`mailto:?subject=${subject}&body=${body}`;
  } else {
    const msg=encodeURIComponent(`AlignerEst™ Treatment Plan for ${name}: Upper ${uT||'—'} trays, Lower ${lT||'—'} trays (~${combT*2} weeks total). Your doctor will confirm after full clinical evaluation.`);
    window.location.href=`sms:?body=${msg}`;
  }
}

function bindInputs(){
  const nameEl=document.getElementById('inp-name');
  const dobEl=document.getElementById('inp-dob');
  if(nameEl) nameEl.addEventListener('input',e=>{state.patName=e.target.value;document.getElementById('pat-badge').textContent=state.patName;});
  if(dobEl)  dobEl.addEventListener('input',e=>{state.patDOB=e.target.value;});
}

// ── roundRect polyfill ────────────────────────────────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);
    this.closePath();return this;
  };
}

render();
</script>
